      display: flex; gap: 16px; padding: 24px 40px;

    }
    .score-card {

    }
    .score-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: #6b7280; }
    .score-card .value { font-size: 22px; font-weight: 700; color: #1a1a2e; margin-top: 4px; }
    .score-card.highlight .value { color: #16a34a; }

    .controls {
      display: flex; gap: 12px; padding: 20px 40px; align-items: center; flex-wrap: wrap;
    }
    .controls input, .controls select {
      padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px;

    .controls label { font-size: 12px; color: #6b7280; margin-right: 4px; }
    .controls .control-group { display: flex; align-items: center; gap: 6px; }

    .table-wrap { padding: 0 40px 40px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    thead { background: #1a1a3e; color: white; }
    th {
      padding: 12px 14px; text-align: left; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.6px;
      cursor: pointer; user-select: none; white-space: nowrap;
    }
    th:hover { background: #2d2b6b; }
    th.sorted-asc::after { content: ' ↑'; }
    th.sorted-desc::after { content: ' ↓'; }
    td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #f0f1f3; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8f9fb; }

    .card-name  { font-weight: 600; color: #1a1a2e; }
    .card-num   { color: #6b7280; font-size: 12px; text-align: center; }
    .card-brand { color: #374151; font-size: 12px; }
    .qty        { text-align: center; font-weight: 600; }
    .money      { text-align: right; font-variant-numeric: tabular-nums; }
    .total-value { font-weight: 700; color: #16a34a; }
    .high-value  { background: #fefce8 !important; }
    .high-value .total-value { color: #b45309; }

    .tfoot-row td { background: #1a1a3e; color: white; font-weight: 700; font-size: 13px; }
    .tfoot-row .total-value { color: #86efac; }

    @media (max-width: 768px) {

    }
  </style>
</head>

function parseCsv(raw) {
  return raw.trim().split('\n').slice(1).map(line => {
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    return {
      num:   cols[0] || '',
      name:  cols[1] || '',
      brand: cols[2] || '',
      qty:   parseInt(cols[3]) || 0,
      price: parseFloat(cols[4]) || 0,
      total: parseFloat(cols[5]) || 0
    };
  }).filter(r => r.name);
}

const DATA = parseCsv(RAW);

function fmt$(v) {
  return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

let sorted = { col: 'name', dir: 'asc' };
let filtered = [...DATA];

function buildBrandOptions() {
  const brands = [...new Set(DATA.map(r => r.brand))].sort();
  const sel = document.getElementById('filter-brand');
  brands.forEach(b => {
    const opt = document.createElement('option');
    opt.value = b; opt.textContent = b;
    sel.appendChild(opt);
  });
}

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase();
  const brand = document.getElementById('filter-brand').value;
  filtered = DATA.filter(r => {
    const matchBrand = !brand || r.brand === brand;
    const matchSearch = !q || r.name.toLowerCase().includes(q) || r.num.includes(q);
    return matchBrand && matchSearch;
  });
  sortAndRender();
}

function sortAndRender() {
  const colMap = {
    num:   r => r.num,
    name:  r => r.name.toLowerCase(),
    brand: r => r.brand,
    qty:   r => r.qty,
    price: r => r.price,
    total: r => r.total
  };
  filtered.sort((a, b) => {
    const va = colMap[sorted.col](a), vb = colMap[sorted.col](b);
    const cmp = typeof va === 'number' ? va - vb : va.localeCompare(vb);
    return sorted.dir === 'asc' ? cmp : -cmp;
  });
  renderTable();
}

function renderTable() {
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';
  let totalQty = 0, totalVal = 0;

  filtered.forEach(r => {
    totalQty += r.qty;
    totalVal += r.total;
    const hi = r.total >= 100;
    const tr = document.createElement('tr');
    if (hi) tr.classList.add('high-value');
    tr.innerHTML = `
      <td class="card-num">${r.num}</td>
      <td class="card-name">${r.name}</td>
      <td class="card-brand">${r.brand}</td>
      <td class="qty">${r.qty}</td>
      <td class="money">${r.price > 0 ? fmt$(r.price) : '—'}</td>
      <td class="money total-value">${r.total > 0 ? fmt$(r.total) : '—'}</td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('foot-qty').textContent = totalQty.toLocaleString();
  document.getElementById('foot-total').textContent = fmt$(totalVal);
  document.getElementById('row-count').textContent = filtered.length + ' of ' + DATA.length + ' items';
  document.getElementById('stat-lines').textContent = filtered.length;
  document.getElementById('stat-qty').textContent = totalQty.toLocaleString();
  document.getElementById('stat-value').textContent = fmt$(totalVal);
}

document.querySelectorAll('th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    sorted.dir = sorted.col === col && sorted.dir === 'asc' ? 'desc' : 'asc';
    sorted.col = col;
    document.querySelectorAll('th').forEach(t => t.classList.remove('sorted-asc', 'sorted-desc'));
    th.classList.add('sorted-' + sorted.dir);
    sortAndRender();
  });
});

document.getElementById('search').addEventListener('input', applyFilters);
document.getElementById('filter-brand').addEventListener('change', applyFilters);

buildBrandOptions();
applyFilters();
document.querySelector('th[data-col="name"]').classList.add('sorted-asc');
</script>
</body>
</html>
